<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Católica · Revisión Copys 2027-1 · Adcom</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/favicon-adcom.png">
<link rel="apple-touch-icon" href="../assets/ds/logos/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/ds/fonts.css">
<link rel="stylesheet" href="../assets/ds/tokens.css">
<link rel="stylesheet" href="../assets/ds/bundle.css">
<link rel="stylesheet" href="../assets/ds-copys/adcom-copys.css">
</head>
<body class="ad-root copys">

<!-- LOGIN MODAL -->
<div class="overlay" id="modal">
  <div class="mbox">
    <img src="../assets/ds/logos/adcom-mark.png" alt="Adcom">
    <div class="mtitle">Revisión de Copys</div>
    <div class="msub">Universidad Católica de Colombia · 2027-1 · Copys por driver<br>Ingresa tu nombre para registrar tus aprobaciones y comentarios.</div>
    <input class="minput" id="cni" placeholder="Tu nombre completo..." maxlength="60" onkeydown="if(event.key==='Enter')go()">
    <button class="mbtn" onclick="go()">Empezar revisión →</button>
    <div class="ybar"></div>
  </div>
</div>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-l">
    <img src="../assets/ds/logos/adcom-mark.png" alt="Adcom"><span class="hdr-sep" aria-hidden="true"></span>
    <div class="hdr-title">Católica · <span>Revisión Copys 2027-1</span></div>
  </div>
  <div class="hdr-r">
    <span class="pill pill-y" id="counter">Cargando...</span>
    <span class="pill pill-w" id="clabel">Revisión cliente</span>
  </div>
</header>

<!-- FILTER BAR -->
<div class="fbar">
  <div class="fgrp" data-f="nivel">
    <span class="flbl">Nivel:</span>
    <button class="fb on" data-v="all">Todos</button>
    <button class="fb" data-v="Pregrado" data-c="on-pre">Pregrado</button>
    <button class="fb" data-v="Posgrado" data-c="on-pos">Posgrado</button>
  </div>
  <div class="sep"></div>
  <div class="fgrp" data-f="medio">
    <span class="flbl">Bloque:</span>
    <button class="fb on" data-v="all">Todos</button>
    <button class="fb" data-v="pz" data-c="on-pz">Piezas</button>
    <button class="fb" data-v="meta" data-c="on-meta">Copy out</button>
    <button class="fb" data-v="google" data-c="on-google">Google</button>
  </div>
  <div class="sep"></div>
  <div class="fgrp">
    <span class="flbl">Driver:</span>
    <select class="fsel" id="fdrv"><option value="all">Todos</option></select>
  </div>
  <div class="prog-wrap">
    <div class="prog-out"><div class="prog-in" id="pbar" style="width:0%"></div></div>
    <span class="prog-txt" id="ptxt">0 / 0 revisados</span>
  </div>
</div>

<main class="main" id="main">
  <div class="loading"><div class="spinner"></div><span>Cargando copys desde el Sheet...</span></div>
</main>

<div class="cp-foot">Adcom · Brand Group</div>
<script>
// ─── CONFIG ───────────────────────────────────────────────────
const SURL = 'https://script.google.com/macros/s/AKfycbx_Axun2OsZ7k6yvLNE15zsQ5NR68TrbmZWYTcyB2ddCThHoUAwNKt4KAgVHLzE4WIp/exec';
const SHEET_NAME = 'Copys';
const OUT_MAX = 150, H_MAX = 30, D_MAX = 90;
// Bloques de revisión: clave interna → nombre que recibe el Apps Script
const BLOQ = [
  {k:'p1', medio:'Pieza 1',    tipo:'pz',     n:1, tag:'Pieza 1 · texto dentro de la imagen'},
  {k:'o1', medio:'Copy out 1', tipo:'meta',   n:1, tag:'Copy out 1 · texto del anuncio en Meta'},
  {k:'p2', medio:'Pieza 2',    tipo:'pz',     n:2, tag:'Pieza 2 · texto dentro de la imagen'},
  {k:'o2', medio:'Copy out 2', tipo:'meta',   n:2, tag:'Copy out 2 · texto del anuncio en Meta'},
  {k:'g',  medio:'Google',     tipo:'google', n:0, tag:'Google · anuncio de búsqueda'}
];
const DRIVERS = {
  P1:'Primera generación universitaria', P2:'El que quiere ver resultados', P3:'El que busca acompañamiento', P4:'El que retoma sus estudios',
  G1:'El profesional que necesita respaldo', G2:'El que estudia mientras trabaja', G3:'El que busca ascender', G4:'El que quiere investigar'
};

let DATA = [], ST = {}, OPEN = {};
let F = {nivel:'all', medio:'all', estado:'all', drv:'all'};
let reviewer = '';

function go() {
  const v = document.getElementById('cni').value.trim();
  if (!v) { document.getElementById('cni').style.borderColor = '#a3241b'; return }
  reviewer = v;
  document.getElementById('clabel').textContent = v;
  document.getElementById('modal').style.display = 'none'
}

function st(v) { v = String(v||'').toLowerCase(); return v.startsWith('aprob') ? 'aprobado' : v.startsWith('rechaz') ? 'rechazado' : 'pendiente' }

// Busca la columna por el inicio del encabezado (p. ej. "COPY OUT 1" sirve para "COPY OUT 1 (máx 150)")
function col(r, pre) { pre = pre.toUpperCase(); const k = Object.keys(r).find(h => h.toUpperCase().startsWith(pre)); return k ? String(r[k]).trim() : '' }
function code(d) { return (String(d).match(/^[PG]\d/) || [''])[0] }

async function loadData() {
  try {
    const ctl = new AbortController();
    const tmo = setTimeout(() => ctl.abort(), 30000);
    const res = await fetch(SURL + '?action=getCopys&sheet=' + encodeURIComponent(SHEET_NAME), { signal: ctl.signal });
    clearTimeout(tmo);
    const json = await res.json();
    if (json.status !== 'ok' || !json.data || !json.data.length) { showError('No se encontraron datos en la pestaña de copys.'); return }

    DATA = json.data.map(r => ({
      nivel: r['Nivel']||'', programa: r['Programa']||'', modalidad: r['Modalidad']||'',
      duracion: r['Duración']||'', snies: r['SNIES']||'',
      d: [null,
        {drv: col(r,'Driver 1'), url: col(r,'drv 1'), t: col(r,'Pieza 1 titular'), a: col(r,'Pieza 1 apoyo'), out: col(r,'COPY OUT 1')},
        {drv: col(r,'Driver 2'), url: col(r,'drv 2'), t: col(r,'Pieza 2 titular'), a: col(r,'Pieza 2 apoyo'), out: col(r,'COPY OUT 2')}],
      // Encabezado exacto: "GOOGLE H1" por prefijo también tomaría "GOOGLE H10"
      h: Array.from({length:15}, (_, j) => String(r['GOOGLE H'+(j+1)]||'').trim()).filter(Boolean),
      ds: Array.from({length:4}, (_, j) => String(r['GOOGLE D'+(j+1)]||'').trim()).filter(Boolean),
      est: BLOQ.map(b => /^aprob/i.test(String(r['Estado']||'').trim()) ? 'aprobado' : st(r['Estado '+b.medio]))
    }));
    DATA.forEach((p, i) => {
      ST[i] = {};
      BLOQ.forEach((b, j) => ST[i][b.k] = { e: p.est[j], init: p.est[j], c: '', sent: false, saved: p.est[j] !== 'pendiente' })
    });
    const sel = document.getElementById('fdrv');
    const used = new Set(DATA.flatMap(p => [code(p.d[1].drv), code(p.d[2].drv)]));
    sel.innerHTML = '<option value="all">Todos</option>' + Object.keys(DRIVERS).filter(c => used.has(c)).map(c => `<option value="${c}">${c} · ${DRIVERS[c]}</option>`).join('');
    build()
  } catch (err) {
    showError(err.name === 'AbortError' ? 'La carga tardó demasiado. Intenta de nuevo.' : 'Error de conexión al cargar datos: ' + err.message)
  }
}

function showError(msg) {
  document.getElementById('main').innerHTML = '<div class="empty"><p>' + esc(msg) + '</p><button class="sbtn" style="margin-top:16px" onclick="loadData()">Reintentar</button></div>';
  document.getElementById('counter').textContent = 'Error'
}

function prevPieza(p, d) {
  return `<div class="pz-prev" aria-label="Vista de referencia de la pieza"><span class="uc">UNIVERSIDAD CATÓLICA DE COLOMBIA</span>
    <div class="t">${esc(d.t)}</div><div class="a">${esc(d.a)}</div>
    <div class="s">${esc(p.programa.toUpperCase())}${p.snies ? ' · SNIES ' + esc(p.snies) : ''}</div></div>`;
}

function blockHTML(p, i, b) {
  const s = ST[i][b.k];
  const d = b.n ? p.d[b.n] : null;
  let cnt = '', extra = '';
  if (d) extra = `<span class="dtag">${esc(d.drv)}<code>${esc(d.url)}</code></span>`;
  if (b.tipo === 'pz') {
    cnt = `<div class="pz-g">${prevPieza(p, d)}
      <div class="pz-parts">
        <div class="cbox bpz"><span class="ctag">Titular · texto grande</span><p class="ctxt"><b>${esc(d.t)}</b></p><div class="cchars">${d.t.length} caracteres</div></div>
        <div class="cbox bpz"><span class="ctag">Apoyo · línea de soporte</span><p class="ctxt">${esc(d.a)}</p><div class="cchars">${d.a.length} caracteres</div></div>
        <p class="ref">La vista previa es de referencia. El diseño final lo define el equipo creativo.</p>
      </div>
    </div>`;
  } else if (b.tipo === 'meta') {
    const n = d.out.length, ok = n <= OUT_MAX ? '●' : '▲';
    cnt = `<div class="cbox bm"><span class="ctag">Copy out · va encima de la pieza ${b.n} en la publicación</span><p class="ctxt">${esc(d.out)}</p><div class="cchars">${n} / ${OUT_MAX} caracteres ${ok}</div></div>`;
  } else {
    const chips = p.h.map(h => `<span class="chip${h.length > H_MAX ? ' bad' : ''}">${esc(h)}<em>${h.length}</em></span>`).join('');
    const ds = p.ds.map(x => `<div${x.length > D_MAX ? ' style="border-color:var(--no)"' : ''}>${esc(x)}<em>${x.length}/${D_MAX}</em></div>`).join('');
    cnt = `<div class="g-wrap">
      <div class="serp"><small><b>Patrocinado</b></small><span class="u">programas.ucatolica.edu.co</span>
        <div class="tt">${esc(p.h.slice(0,3).join(' | '))}</div><div class="dd">${esc(p.ds.slice(0,2).join(' '))}</div>
        <p class="ref" style="font-family:Poppins,sans-serif">Ejemplo de combinación. Google rota los títulos y las descripciones.</p></div>
      <div class="cbox bg"><span class="ctag">Descripciones · máximo ${D_MAX} caracteres</span><div class="dlist">${ds}</div></div>
    </div>
    <div class="cbox bg" style="margin-top:10px"><span class="ctag">Títulos · ${p.h.length} · máximo ${H_MAX} caracteres</span><div class="chips">${chips}</div></div>`;
  }
  const bc = s.e === 'aprobado' ? 'sbdg-a' : s.e === 'rechazado' ? 'sbdg-r' : 'sbdg-p';
  const bl = s.e === 'aprobado' ? '✓ Aprobado' : s.e === 'rechazado' ? '✕ Rechazado' : '● Pendiente';
  return `<div class="msec">
    <div class="mhdr"><div class="mhdr-l"><div class="dot dot-${b.tipo}"></div><span class="mnm">${b.tag}</span>${extra}</div>
      <span class="sbdg ${bc}" id="bdg-${i}-${b.k}">${bl}</span></div>
    ${cnt}
    <div class="rpanel"><div class="rptitle">Tu revisión</div>
      <div class="rrow">
        <div class="rbtns">
          <button class="rbtn rbtn-a${s.e==='aprobado'?' on':''}" id="ba-${i}-${b.k}" onclick="setE(${i},'${b.k}','aprobado')">✓ Aprobar</button>
          <button class="rbtn rbtn-r${s.e==='rechazado'?' on':''}" id="br-${i}-${b.k}" onclick="setE(${i},'${b.k}','rechazado')">✕ Rechazar</button>
        </div>
        <textarea class="cinput" id="ci-${i}-${b.k}" placeholder="Comentario o corrección (opcional)...">${esc(s.c)}</textarea>
        <button class="sbtn" id="sb-${i}-${b.k}" onclick="send(${i},'${b.k}')"${s.sent?' style="display:none"':''}>Enviar</button>
        <span class="sok" id="ok-${i}-${b.k}" style="display:${s.sent?'inline':'none'}">✓ Enviado</span>
      </div>
    </div>
  </div>`;
}

const GUIA = `<details class="guia" id="guia" open>
  <summary><h2>Cómo leer y revisar cada programa</h2><span><i class="o">Ocultar guía ▴</i><i class="c">Ver guía ▾</i></span></summary>
  <div class="g-body">
    <div class="post" aria-label="Ejemplo de anuncio en Meta">
      <div class="post-h"><div class="av">UC</div><div><b>Universidad Católica de Colombia</b><small>Publicidad</small></div></div>
      <div class="post-out"><span class="n">1</span>Tus profesores son jueces, magistrados y litigantes en ejercicio. En clínicas jurídicas asumes casos reales. Conoce Derecho en la Católica.</div>
      <div class="pz-prev"><span class="uc">UNIVERSIDAD CATÓLICA DE COLOMBIA</span>
        <div class="t">Aprende de jueces y magistrados en ejercicio <span class="n" style="position:static;vertical-align:middle">2</span></div>
        <div class="a">Clínicas jurídicas y consultorios donde asumes casos reales. <span class="n" style="position:static;vertical-align:middle">3</span></div>
        <div class="s">DERECHO · SNIES 1381</div></div>
      <div class="post-f"><div><small>programas.ucatolica.edu.co</small><b>Inscripciones 2027-1</b></div><span class="btn">Más información</span></div>
    </div>
    <div class="leg">
      <div><h3>Dos razones por programa</h3>
        <p style="font-size:12.5px;color:var(--t2);line-height:1.55">Cada programa tiene dos piezas. Cada una le habla a una sola razón para decidir (un <b>driver</b>) de la ruta estratégica 2027-1. La pieza 1 sale del <b>por qué estudiar</b> y la pieza 2 del <b>diferencial</b> que nos compartieron. El driver va en la URL del anuncio para medir cuál trae más matrículas.</p></div>
      <div class="drv-tbl">
        <div><b>Pregrado</b><br>P1 Primera generación · P2 Ver resultados · P3 Acompañamiento · P4 Retoma sus estudios</div>
        <div><b>Posgrado</b><br>G1 Respaldo · G2 Estudia mientras trabaja · G3 Ascender · G4 Investigar</div>
      </div>
      <div class="li"><span class="n">1</span><div><b>Copy out.</b> El texto encima de la pieza en Meta. Máximo 150 caracteres, uno por pieza.</div></div>
      <div class="li"><span class="n">2</span><div><b>Titular.</b> La frase grande de la pieza: un solo argumento. Las piezas de solo texto son las que traen leads a menor costo.</div></div>
      <div class="li"><span class="n">3</span><div><b>Apoyo.</b> La línea que respalda el titular con un dato del programa.</div></div>
      <div class="li"><span class="n">G</span><div><b>Google.</b> 15 títulos (máximo 30 caracteres) y 4 descripciones (máximo 90) por programa. Google los combina solo.</div></div>
      <div><h3 style="margin-top:6px">Cómo revisar</h3>
        <div class="pasos">
          <div><b>1</b>Lee las dos piezas, sus copy out y el bloque de Google.</div>
          <div><b>2</b>Marca Aprobar o Rechazar en cada bloque.</div>
          <div><b>3</b>Si rechazas, escribe qué cambiar.</div>
          <div><b>4</b>Da Enviar. Queda guardado en el Sheet.</div>
        </div>
      </div>
      <p style="font-size:12px;color:var(--t3);line-height:1.5">Todo dato sale del contenido de landing que nos compartió la universidad. Lo que apruebes pasa solo a la pestaña Copys aprobados.</p>
    </div>
  </div>
</details>`;

function build() {
  const main = document.getElementById('main');
  const g = document.getElementById('guia');
  let html = GUIA.replace(' open>', g && !g.open ? '>' : ' open>');
  let count = 0;
  DATA.forEach((p, i) => {
    const isPre = p.nivel.toLowerCase().includes('pregrado');
    if (F.nivel === 'Pregrado' && !isPre) return;
    if (F.nivel === 'Posgrado' && isPre) return;
    const bloques = BLOQ.filter(b => {
      if (F.medio !== 'all' && F.medio !== b.tipo) return false;
      if (ST[i][b.k].init !== 'pendiente') return false;
      if (F.drv !== 'all') { if (!b.n || code(p.d[b.n].drv) !== F.drv) return false }
      return true;
    });
    if (!bloques.length) return;
    count++;
    const cls = isPre ? 'pre' : 'pos';
    const mini = BLOQ.map(b => `<i class="${ST[i][b.k].e==='aprobado'?'a':ST[i][b.k].e==='rechazado'?'r':''}" title="${b.medio}"></i>`).join('');
    html += `<div class="card${OPEN[i]===false?' closed':''}" id="card-${i}">
      <div class="ch ch-${cls}" onclick="tog(${i})">
        <span class="lvl-badge">${esc(p.nivel.toUpperCase())}</span>
        <div class="prog-n">${esc(p.programa)}</div>
        <span class="prog-m">${esc(p.modalidad)} · ${esc(p.duracion)}</span>
        <div class="ch-r"><span class="mini" id="mini-${i}">${mini}</span><span class="chev">▾</span></div>
      </div>
      <div class="cbody">${bloques.map(b => blockHTML(p, i, b)).join('')}</div>
    </div>`;
  });
  if (!count) html += '<div class="empty">No hay programas con estos filtros.</div>';
  main.innerHTML = html;
  document.getElementById('counter').textContent = count + ' programas';
  updP()
}

function tog(i) { OPEN[i] = OPEN[i] === false; document.getElementById('card-'+i).classList.toggle('closed') }

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function setE(i, k, e) {
  const s = ST[i][k];
  s.e = e;
  if (s.sent) { s.sent = false; const sb = document.getElementById('sb-'+i+'-'+k); if (sb) { sb.style.display=''; sb.disabled=false; sb.textContent='Enviar' } const ok = document.getElementById('ok-'+i+'-'+k); if (ok) ok.style.display='none' }
  document.getElementById('ba-'+i+'-'+k).className = 'rbtn rbtn-a' + (e==='aprobado'?' on':'');
  document.getElementById('br-'+i+'-'+k).className = 'rbtn rbtn-r' + (e==='rechazado'?' on':'');
}

async function send(i, k) {
  const p = DATA[i], s = ST[i][k], b = BLOQ.find(x => x.k === k);
  s.c = document.getElementById('ci-'+i+'-'+k).value.trim();
  if (s.e === 'pendiente') { alert('Selecciona Aprobar o Rechazar antes de enviar.'); return }
  if (s.e === 'rechazado' && !s.c) { alert('Cuéntanos qué cambiar en el comentario antes de rechazar.'); return }
  const sb = document.getElementById('sb-'+i+'-'+k);
  sb.disabled = true; sb.textContent = 'Enviando...';
  try {
    await fetch(SURL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        programa: p.programa, nivel: p.nivel, medio: b.medio,
        estado: s.e === 'aprobado' ? 'Aprobado' : 'Rechazado',
        comentario: s.c, revisor: reviewer
      })
    });
    s.sent = true; s.saved = true;
    sb.style.display = 'none';
    document.getElementById('ok-'+i+'-'+k).style.display = 'inline';
    const bdg = document.getElementById('bdg-'+i+'-'+k);
    bdg.className = 'sbdg ' + (s.e==='aprobado'?'sbdg-a':'sbdg-r');
    bdg.textContent = s.e==='aprobado' ? '✓ Aprobado' : '✕ Rechazado';
    document.getElementById('mini-'+i).innerHTML = BLOQ.map(x => `<i class="${ST[i][x.k].saved && ST[i][x.k].e==='aprobado'?'a':ST[i][x.k].saved && ST[i][x.k].e==='rechazado'?'r':''}" title="${x.medio}"></i>`).join('');
    updP()
  } catch (err) {
    sb.disabled = false; sb.textContent = 'Enviar';
    alert('Error al enviar. Verifica tu conexión.')
  }
}

function updP() {
  let done = 0, total = 0;
  DATA.forEach((_, i) => BLOQ.forEach(b => { if (ST[i][b.k].init !== 'pendiente') return; total++; if (ST[i][b.k].saved) done++ }));
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ptxt').textContent = done + ' / ' + total + ' revisados'
}

document.querySelectorAll('.fgrp[data-f]').forEach(g => g.querySelectorAll('.fb').forEach(btn => btn.onclick = () => {
  g.querySelectorAll('.fb').forEach(x => x.className = 'fb');
  btn.className = 'fb ' + (btn.dataset.c || 'on');
  F[g.dataset.f] = btn.dataset.v;
  build()
}));
document.getElementById('fdrv').onchange = e => { F.drv = e.target.value; build() };

loadData();
</script>
</body>
</html>
